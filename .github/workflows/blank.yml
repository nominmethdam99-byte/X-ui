name: Deploy GPU VPS with SSH Tunnel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y sshpass curl wget

    - name: Deploy & Setup Tunnel
      run: |
        # HARDCODED VALUES - REPLACE WITH YOUR ACTUAL VPS INFO
        VPS_IP="YOUR_VPS_IP_HERE"        # ← CHANGE THIS
        VPS_USER="root"                  # ← CHANGE IF NEEDED
        VPS_PASSWORD="12345678"          # ← CHANGE THIS
        
        echo "========================================="
        echo "Deploying to: $VPS_USER@$VPS_IP"
        echo "========================================="
        
        # Test SSH connection
        echo "Testing SSH connection..."
        if ! sshpass -p "$VPS_PASSWORD" ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no "$VPS_USER@$VPS_IP" "echo '✅ SSH OK'" 2>&1; then
          echo "❌ SSH Failed! Check IP, username, or password"
          exit 1
        fi
        echo "✅ SSH Connected!"

        # Full setup
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_IP" bash -s << 'EOF'
          set -e
          
          echo "========================================="
          echo "1. SYSTEM UPDATE"
          echo "========================================="
          apt update -qq && apt upgrade -y -qq
          apt install -y -qq wget curl git python3-pip build-essential

          echo "========================================="
          echo "2. INSTALL RUST"
          echo "========================================="
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            export PATH="$HOME/.cargo/bin:$PATH"
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> ~/.bashrc
          fi
          export PATH="$HOME/.cargo/bin:$PATH"

          echo "========================================="
          echo "3. INSTALL BORE.PUB"
          echo "========================================="
          if ! command -v bore &> /dev/null; then
            cargo install bore-cli || ~/.cargo/bin/cargo install bore-cli
          fi

          echo "========================================="
          echo "4. INSTALL NVIDIA GPU DRIVERS"
          echo "========================================="
          apt install -y -qq nvidia-driver-535 nvidia-utils-535 || echo "⚠️ GPU drivers install skipped"

          echo "========================================="
          echo "5. START SSH TUNNEL"
          echo "========================================="
          pkill -f "bore local 22" 2>/dev/null || true
          
          # Start tunnel
          nohup bash -c 'while true; do ~/.cargo/bin/bore local 22 --to bore.pub; sleep 5; done' >> /root/tunnel.log 2>&1 &
          
          sleep 5
          echo "========================================="
          echo "6. TUNNEL INFO"
          echo "========================================="
          echo "✅ Tunnel started!"
          echo ""
          echo "Find your port:"
          echo "  cat /root/tunnel.log | grep -o 'bore.pub:[0-9]*' | tail -1"
          echo ""
          echo "Connect via:"
          echo "  ssh -p <PORT> root@bore.pub"
          echo "========================================="
        EOF
        
        echo ""
        echo "✅ DEPLOYMENT COMPLETE!"
        echo ""
        echo "To get tunnel port, run:"
        echo "  sshpass -p '$VPS_PASSWORD' ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_IP 'cat /root/tunnel.log | grep -o \"bore.pub:[0-9]*\" | tail -1'"
EOF