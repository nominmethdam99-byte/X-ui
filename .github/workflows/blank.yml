name: 3X-UI Panel Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-3x-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3X-UI Panel
        run: |
          # Download install script first
          curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh -o /tmp/install.sh
          chmod +x /tmp/install.sh
          
          # Run install script with sudo (non-interactive)
          sudo bash /tmp/install.sh << 'EOF'
          n
          EOF
        shell: bash

      - name: Configure 3X-UI Settings
        run: |
          # Set username, password, and port
          sudo /usr/local/x-ui/x-ui setting -username "nomin" -password "2010" -port "2026"
          
          # Generate random web base path
          webBasePath=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9' | head -c 18)
          sudo /usr/local/x-ui/x-ui setting -webBasePath "$webBasePath"
          
          # Restart service
          sudo systemctl restart x-ui
          sleep 3
          
          # Verify panel is running
          sudo systemctl status x-ui --no-pager
          
          # Save settings for later steps
          echo "WEB_BASE_PATH=$webBasePath" >> $GITHUB_ENV
          echo "PANEL_PORT=2026" >> $GITHUB_ENV

      - name: Install and Configure ngrok
        run: |
          # Download ngrok binary directly
          curl -Lo /tmp/ngrok.tgz https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar -xzf /tmp/ngrok.tgz -C /tmp
          chmod +x /tmp/ngrok
          sudo mv /tmp/ngrok /usr/local/bin/ngrok
          
          # Configure ngrok with authtoken
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
          # Start ngrok tunnel for port 2026
          nohup ngrok http 2026 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 15
          
          # Check if ngrok started
          if ! pgrep -x "ngrok" > /dev/null; then
            echo "❌ Ngrok failed to start!"
            cat /tmp/ngrok.log
            exit 1
          fi
          
          # Get public URL from ngrok API
          NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -o '"public_url":"[^"]*' | grep -o 'https://[^"]*')
          
          if [ -z "$NGROK_URL" ]; then
            echo "❌ Failed to get ngrok URL!"
            cat /tmp/ngrok.log
            exit 1
          fi
          
          echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV
          echo "PANEL_URL=${NGROK_URL}/${WEB_BASE_PATH}" >> $GITHUB_ENV
          echo "✅ Ngrok tunnel established!"

      - name: Show Panel Access URL
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           🚀 3X-UI PANEL ACCESS INFORMATION                 ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Username:     nomin                                         ║"
          echo "║  Password:     2010                                          ║"
          echo "║  Port:         2026                                           ║"
          echo "║  WebBasePath:  ${{ env.WEB_BASE_PATH }}"                      ║"
          echo "║                                                               ║"
          echo "║  🔗 PANEL URL: ${{ env.PANEL_URL }}                            ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  ⏰ Panel will run for 6 hours then auto-stop                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          
          # Test if panel is accessible
          echo "Testing panel accessibility..."
          curl -I -s http://127.0.0.1:2026/${{ env.WEB_BASE_PATH }} || echo "Local check completed"

      - name: Keep Panel Running for 6 Hours
        run: |
          echo "⏳ Panel is running... Will auto-stop after 6 hours"
          echo "Access URL: ${{ env.PANEL_URL }}"
          echo ""
          
          # Run for 6 hours (360 minutes)
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360 minutes] Panel running at ${{ env.PANEL_URL }}"
            
            # Check if panel is still alive
            if ! curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:2026/${{ env.WEB_BASE_PATH }} | grep -q "200\|307"; then
              echo "⚠️ Panel seems down, restarting..."
              sudo systemctl restart x-ui
            fi
            
            # Check if ngrok is still running
            if ! pgrep -x "ngrok" > /dev/null; then
              echo "⚠️ Ngrok stopped, restarting..."
              nohup ngrok http 2026 --log=stdout > /tmp/ngrok.log 2>&1 &
              sleep 5
            fi
          done
          
          echo "✅ 6 hours completed. Stopping panel..."

      - name: Stop Panel After 6 Hours
        if: always()
        run: |
          echo "🛑 Stopping 3X-UI Panel..."
          sudo pkill ngrok || true
          sudo systemctl stop x-ui || true
          sudo systemctl disable x-ui || true
          echo "✅ Panel stopped successfully"
