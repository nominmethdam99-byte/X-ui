name: 3X-UI Panel with SSL + Cloudflare + Bore.pub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-3x-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3X-UI Panel
        run: |
          curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh -o /tmp/install.sh
          chmod +x /tmp/install.sh
          sudo bash /tmp/install.sh << 'EOF'
          n
          EOF

      - name: Configure 3X-UI Settings
        run: |
          webBasePath=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9' | head -c 18)
          echo "WEB_BASE_PATH=$webBasePath" >> $GITHUB_ENV
          
          sudo /usr/local/x-ui/x-ui setting -username "nomin" -password "2010" -port "2026" -webBasePath "$webBasePath"
          sudo /usr/local/x-ui/x-ui setting -listenIP "0.0.0.0"
          sudo systemctl restart x-ui
          sleep 5

      - name: Setup SSL Certificate
        run: |
          echo "=== Generating SSL Certificate ==="
          sudo mkdir -p /root/cert
          sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /root/cert/privkey.pem \
            -out /root/cert/fullchain.pem \
            -subj "/C=US/ST=State/L=City/O=Organization/CN=localhost"
          sudo chmod 600 /root/cert/privkey.pem
          sudo chmod 644 /root/cert/fullchain.pem
          sudo /usr/local/x-ui/x-ui cert -webCert /root/cert/fullchain.pem -webCertKey /root/cert/privkey.pem
          sudo systemctl restart x-ui
          sleep 3
          echo "SSL Certificate Applied"

      - name: Install Cloudflare Tunnel
        run: |
          echo "=== Installing Cloudflare Tunnel ==="
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y
          nohup cloudflared tunnel --url http://localhost:2026 > /tmp/cloudflare.log 2>&1 &
          sleep 15
          CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflare.log | head -1)
          if [ -z "$CF_URL" ]; then
            sleep 10
            CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflare.log | head -1)
          fi
          if [ -z "$CF_URL" ]; then
            cat /tmp/cloudflare.log
            exit 1
          fi
          echo "CF_URL=$CF_URL" >> $GITHUB_ENV
          echo "CLOUDFLARE_PANEL_URL=${CF_URL}/${WEB_BASE_PATH}" >> $GITHUB_ENV

      - name: Install Bore.pub Tunnel
        run: |
          echo "=== Installing Bore.pub Tunnel ==="
          curl -LSs https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo mv /tmp/bore /usr/local/bin/bore
          chmod +x /usr/local/bin/bore
          nohup bore local 2026 --to bore.pub --port 443 > /tmp/bore.log 2>&1 &
          sleep 10
          BORE_URL=$(grep -o 'bore.pub:[0-9]*' /tmp/bore.log | head -1)
          if [ -z "$BORE_URL" ]; then
            sleep 5
            BORE_URL=$(grep -o 'bore.pub:[0-9]*' /tmp/bore.log | head -1)
          fi
          if [ -n "$BORE_URL" ]; then
            echo "BORE_URL=http://$BORE_URL" >> $GITHUB_ENV
            echo "BORE_PANEL_URL=http://$BORE_URL/${WEB_BASE_PATH}" >> $GITHUB_ENV
          fi

      - name: Show Panel Access URLs
        run: |
          echo ""
          echo "=========================================="
          echo "      3X-UI PANEL ACCESS INFORMATION"
          echo "=========================================="
          echo "  Username:     nomin"
          echo "  Password:     2010"
          echo "  Local Port:   2026"
          echo "  WebBasePath:  ${{ env.WEB_BASE_PATH }}"
          echo "=========================================="
          echo "  SSL:          Self-Signed Certificate"
          echo "=========================================="
          echo "  CLOUDFLARE TUNNEL (HTTPS):"
          echo "  ${{ env.CLOUDFLARE_PANEL_URL }}"
          echo "=========================================="
          echo "  BORE.PUB TUNNEL (HTTP):"
          echo "  ${{ env.BORE_PANEL_URL }}"
          echo "=========================================="
          echo "  Panel will run until manually stopped"
          echo "  Bore.pub logs shown every 10 minutes"
          echo "=========================================="

      - name: Monitor and Show Bore.pub Logs
        run: |
          echo "=== Starting Panel Monitoring ==="
          echo "Cloudflare: ${{ env.CLOUDFLARE_PANEL_URL }}"
          echo "Bore.pub: ${{ env.BORE_PANEL_URL }}"
          echo ""
          
          minute=0
          while true; do
            sleep 60
            minute=$((minute + 1))
            
            # Check 3X-UI panel health
            PANEL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:2026/${{ env.WEB_BASE_PATH }} || echo "000")
            
            # Check Cloudflare tunnel
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "[$minute] Cloudflare tunnel DOWN, restarting..."
              nohup cloudflared tunnel --url http://localhost:2026 > /tmp/cloudflare.log 2>&1 &
              sleep 10
              CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflare.log | head -1)
              echo "[$minute] New Cloudflare URL: $CF_URL"
            fi
            
            # Check Bore.pub tunnel
            if ! pgrep -x "bore" > /dev/null; then
              echo "[$minute] Bore.pub tunnel DOWN, restarting..."
              nohup bore local 2026 --to bore.pub --port 443 > /tmp/bore.log 2>&1 &
              sleep 10
              echo "[$minute] Bore.pub restarted"
            fi
            
            # Show Bore.pub logs every 10 minutes
            if [ $((minute % 10)) -eq 0 ]; then
              echo ""
              echo "=========================================="
              echo "  BORE.PUB LOGS - Minute $minute"
              echo "=========================================="
              cat /tmp/bore.log | tail -30
              echo "=========================================="
              echo ""
            fi
            
            # Show status every minute
            if [ "$PANEL_STATUS" = "200" ] || [ "$PANEL_STATUS" = "307" ]; then
              echo "[$minute] Panel OK | Cloudflare: RUNNING | Bore.pub: RUNNING"
            else
              echo "[$minute] Panel status: $PANEL_STATUS, restarting..."
              sudo systemctl restart x-ui
            fi
          done

      - name: Show Final Bore.pub Logs
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "        FINAL BORE.PUB LOGS"
          echo "=========================================="
          cat /tmp/bore.log | tail -50
          echo ""
          echo "=========================================="
          echo "        FINAL CLOUDFLARE LOGS"
          echo "=========================================="
          cat /tmp/cloudflare.log | tail -20

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping all services..."
          sudo pkill cloudflared || true
          sudo pkill bore || true
          sudo systemctl stop x-ui || true
          echo "All services stopped"
