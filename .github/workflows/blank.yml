name: Deploy GPU VPS with Tunnel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install sshpass
      run: sudo apt install -y sshpass

    - name: Full Setup & Tunnel
      env:
        VPS_IP: ${{ secrets.VPS_IP }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      run: |
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_IP << 'EOF'
          # ============================================
          # 1. UPDATE SYSTEM
          # ============================================
          apt update && apt upgrade -y
          apt install -y wget curl git python3-pip

          # ============================================
          # 2. NVIDIA GPU DRIVERS
          # ============================================
          apt install -y nvidia-driver-535 nvidia-utils-535
          wget https://developer.download.nvidia.com/compute/cuda/12.3.0/local_installers/cuda_12.3.0_545.23.06_linux.run
          sh cuda_12.3.0_545.23.06_linux.run --silent --toolkit

          # ============================================
          # 3. INSTALL BORE.PUB
          # ============================================
          cargo install bore-cli || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source ~/.cargo/env
            cargo install bore-cli
          }

          # ============================================
          # 4. START YOUR APP (example: FastAPI)
          # ============================================
          pip install fastapi uvicorn
          cat > /app.py << 'APP'
          from fastapi import FastAPI
          app = FastAPI()
          @app.get("/")
          def root():
              return {"status": "GPU Ready", "gpu": "NVIDIA"}
          APP

          # Run app in background
          nohup uvicorn app:app --host 0.0.0.0 --port 8000 &

          # ============================================
          # 5. TUNNEL WITH BORE.PUB
          # ============================================
          # Tunnel port 8000 to public URL
          bore local 8000 --to bore.pub &

          # Show public URL
          sleep 3
          curl -s https://bore.pub | grep -o 'https://[^"]*' | head -1
        EOF