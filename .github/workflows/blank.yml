name: 3X-UI Panel with Public Tunnel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-3x-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3X-UI Panel
        run: |
          curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh -o /tmp/install.sh
          chmod +x /tmp/install.sh
          sudo bash /tmp/install.sh << 'EOF'
          n
          EOF

      - name: Configure 3X-UI Settings
        run: |
          webBasePath=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9' | head -c 18)
          echo "WEB_BASE_PATH=$webBasePath" >> $GITHUB_ENV
          
          sudo /usr/local/x-ui/x-ui setting -username "nomin" -password "2010" -port "2026" -webBasePath "$webBasePath"
          sudo /usr/local/x-ui/x-ui setting -listenIP "0.0.0.0"
          sudo systemctl restart x-ui
          sleep 5

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          # Download cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y
          
          # Start tunnel to expose port 2026
          nohup cloudflared tunnel --url http://localhost:2026 > /tmp/tunnel.log 2>&1 &
          sleep 15
          
          # Get public URL from logs
          TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log | head -1)
          
          if [ -z "$TUNNEL_URL" ]; then
            sleep 10
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log | head -1)
          fi
          
          if [ -z "$TUNNEL_URL" ]; then
            cat /tmp/tunnel.log
            echo "Tunnel failed to start"
            exit 1
          fi
          
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "PANEL_URL=${TUNNEL_URL}/${WEB_BASE_PATH}" >> $GITHUB_ENV

      - name: Show Panel Access URL
        run: |
          echo ""
          echo "=========================================="
          echo "     3X-UI PANEL ACCESS INFORMATION"
          echo "=========================================="
          echo "  Username:     nomin"
          echo "  Password:     2010"
          echo "  Port:         2026"
          echo "  WebBasePath:  ${{ env.WEB_BASE_PATH }}"
          echo ""
          echo "  PUBLIC PANEL URL:"
          echo "  ${{ env.PANEL_URL }}"
          echo ""
          echo "  This URL works in your browser!"
          echo "  Panel will run for 6 hours"
          echo "=========================================="

      - name: Keep Panel Running for 6 Hours
        run: |
          echo "Panel running at: ${{ env.PANEL_URL }}"
          echo ""
          
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360 minutes] Panel alive at: ${{ env.PANEL_URL }}"
            
            # Check if panel is still alive
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:2026/${{ env.WEB_BASE_PATH }} || echo "000")
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "307" ]; then
              echo "Panel down, restarting..."
              sudo systemctl restart x-ui
            fi
            
            # Check if tunnel is still running
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "Tunnel stopped, restarting..."
              nohup cloudflared tunnel --url http://localhost:2026 > /tmp/tunnel.log 2>&1 &
              sleep 10
            fi
          done

      - name: Cleanup
        if: always()
        run: |
          sudo pkill cloudflared || true
          sudo systemctl stop x-ui || true
