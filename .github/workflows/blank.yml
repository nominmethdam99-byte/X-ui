name: Deploy 3x UI Panel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-panels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Create Docker Compose file
        run: |
          cat > docker-compose.yml << 'EOF'
          version: '3.8'

          services:
            # Panel 1: Heimdall Dashboard
            panel1:
              image: linuxserver/heimdall:latest
              container_name: ui_panel_1
              restart: unless-stopped
              ports:
                - "2026:80"
              volumes:
                - panel1_data:/config
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=UTC
              networks:
                - panel_network

            # Panel 2: File Browser
            panel2:
              image: filebrowser/filebrowser:latest
              container_name: ui_panel_2
              restart: unless-stopped
              ports:
                - "2027:80"
              volumes:
                - /:/srv
                - panel2_data:/database
              environment:
                - FB_USERNAME=nomin
                - FB_PASSWORD=2010
              networks:
                - panel_network

            # Panel 3: System Monitor
            panel3:
              image: netdata/netdata:latest
              container_name: ui_panel_3
              restart: unless-stopped
              ports:
                - "2028:19999"
              volumes:
                - panel3_config:/etc/netdata
                - panel3_lib:/var/lib/netdata
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /var/run/docker.sock:/var/run/docker.sock:ro
              networks:
                - panel_network

            # Nginx Reverse Proxy with Auth
            nginx:
              image: nginx:alpine
              container_name: panel_proxy
              restart: unless-stopped
              ports:
                - "80:80"
              volumes:
                - ./nginx.conf:/etc/nginx/nginx.conf:ro
                - ./htpasswd:/etc/nginx/htpasswd:ro
              depends_on:
                - panel1
                - panel2
                - panel3
              networks:
                - panel_network

          networks:
            panel_network:
              driver: bridge

          volumes:
            panel1_data:
            panel2_data:
            panel3_config:
            panel3_lib:
          EOF

      - name: Create Nginx config
        run: |
          cat > nginx.conf << 'EOF'
          events {
            worker_connections 1024;
          }

          http {
            upstream panel1 {
              server panel1:80;
            }
            upstream panel2 {
              server panel2:80;
            }
            upstream panel3 {
              server panel3:19999;
            }

            server {
              listen 80;
              server_name localhost;

              # Basic Authentication
              auth_basic "Restricted Access";
              auth_basic_user_file /etc/nginx/htpasswd;

              location /panel1 {
                proxy_pass http://panel1/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
              }

              location /panel2 {
                proxy_pass http://panel2/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
              }

              location /panel3 {
                proxy_pass http://panel3/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
              }

              location / {
                return 302 /panel1;
              }
            }
          }
          EOF

      - name: Create htpasswd file
        run: |
          sudo apt-get update && sudo apt-get install -y apache2-utils
          htpasswd -cb htpasswd nomin 2010

      - name: Start containers
        run: |
          docker-compose up -d
          sleep 10

      - name: Check running containers
        run: |
          docker ps
          docker-compose logs

      - name: Get Panel URLs
        run: |
          echo "=========================================="
          echo "🚀 PANEL ACCESS URLS"
          echo "=========================================="
          echo ""
          echo "Username: nomin"
          echo "Password: 2010"
          echo ""
          echo "Panel 1 (Dashboard): http://localhost:2026"
          echo "Panel 2 (File Browser): http://localhost:2027"
          echo "Panel 3 (System Monitor): http://localhost:2028"
          echo ""
          echo "Combined Proxy (with auth): http://localhost"
          echo "  - /panel1 - Dashboard"
          echo "  - /panel2 - File Browser"
          echo "  - /panel3 - System Monitor"
          echo "=========================================="

      - name: Test Panel 1
        run: |
          curl -I http://localhost:2026 || echo "Panel 1 not responding yet"

      - name: Test Panel 2
        run: |
          curl -I http://localhost:2027 || echo "Panel 2 not responding yet"

      - name: Test Panel 3
        run: |
          curl -I http://localhost:2028 || echo "Panel 3 not responding yet"
