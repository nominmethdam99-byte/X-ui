name: 3X-UI Panel Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-3x-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3X-UI Panel
        run: |
          curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh -o /tmp/install.sh
          chmod +x /tmp/install.sh
          sudo bash /tmp/install.sh << 'EOF'
          n
          EOF
        shell: bash

      - name: Configure 3X-UI Settings
        run: |
          # Set username, password, and port
          sudo /usr/local/x-ui/x-ui setting -username "nomin" -password "2010" -port "2026"
          
          # Generate random web base path
          webBasePath=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9' | head -c 18)
          sudo /usr/local/x-ui/x-ui setting -webBasePath "$webBasePath"
          
          # Restart service
          sudo systemctl restart x-ui
          sleep 5
          
          # Verify panel is running
          sudo systemctl status x-ui --no-pager || true
          
          # Save settings
          echo "WEB_BASE_PATH=$webBasePath" >> $GITHUB_ENV
          echo "PANEL_PORT=2026" >> $GITHUB_ENV

      - name: Configure Firewall and Port Forwarding
        run: |
          echo "=== Configuring Firewall ==="
          
          # Check if ufw exists
          if command -v ufw &> /dev/null; then
            echo "UFW found, configuring..."
            sudo ufw allow 2026/tcp || true
            sudo ufw allow 22/tcp || true
            sudo ufw status || true
          fi
          
          # Check if firewalld exists
          if command -v firewall-cmd &> /dev/null; then
            echo "Firewalld found, configuring..."
            sudo firewall-cmd --permanent --add-port=2026/tcp || true
            sudo firewall-cmd --reload || true
          fi
          
          # Configure iptables directly
          echo "Configuring iptables..."
          sudo iptables -I INPUT -p tcp --dport 2026 -j ACCEPT || true
          sudo iptables -I INPUT -p tcp --dport 22 -j ACCEPT || true
          sudo iptables-save || true
          
          # Check if port is listening
          echo "=== Checking if port 2026 is listening ==="
          sudo ss -tlnp | grep 2026 || sudo netstat -tlnp | grep 2026 || echo "Port check completed"
          
          # Check local panel response
          echo "=== Testing local panel ==="
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:2026 || echo "Local test done"

      - name: Get Server IP and Show Panel URL
        run: |
          # Get public IP
          SERVER_IP=$(curl -s https://api4.ipify.org || curl -s https://ipv4.icanhazip.com || curl -s https://v4.ident.me)
          echo "SERVER_IP=$SERVER_IP" >> $GITHUB_ENV
          
          echo ""
          echo "=========================================="
          echo "        3X-UI PANEL ACCESS INFO"
          echo "=========================================="
          echo "  Username:     nomin"
          echo "  Password:     2010"
          echo "  Port:         2026"
          echo "  WebBasePath:  ${{ env.WEB_BASE_PATH }}"
          echo ""
          echo "  PANEL URL: http://${SERVER_IP}:2026/${{ env.WEB_BASE_PATH }}"
          echo "=========================================="
          echo "  Panel will run for 6 hours then stop"
          echo "=========================================="
          echo ""

      - name: Keep Panel Running for 6 Hours
        run: |
          echo "Panel is running..."
          echo "URL: http://${{ env.SERVER_IP }}:2026/${{ env.WEB_BASE_PATH }}"
          echo ""
          
          # Run for 6 hours (360 minutes)
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360 minutes] Panel running..."
            
            # Check if panel is still alive
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:2026/${{ env.WEB_BASE_PATH }} || echo "000")
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "307" ]; then
              echo "Panel seems down (status: $STATUS), restarting..."
              sudo systemctl restart x-ui
              sleep 3
            fi
          done
          
          echo "6 hours completed. Stopping panel..."

      - name: Stop Panel After 6 Hours
        if: always()
        run: |
          echo "Stopping 3X-UI Panel..."
          sudo systemctl stop x-ui || true
          sudo systemctl disable x-ui || true
          echo "Panel stopped"
